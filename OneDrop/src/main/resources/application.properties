spring.application.name=OneDrop

youtube.api.key=AIzaSyDEYDLuOqwcFQyomz8UwYTrMChjY_nSFks

spring.security.user.roles=USER,ADMIN

# =========================================================
# SQLITE DATABASE
# =========================================================

spring.datasource.url=jdbc:sqlite:${user.home}/AppData/Local/OneDrop/database/onedrop.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =========================================================
# SERVER
# =========================================================

server.port=8081

# =========================================================
# SWAGGER
# =========================================================

springdoc.packages-to-scan=com.music.OneDrop

# =========================================================
# CORS
# =========================================================

spring.mvc.cors.enabled=false