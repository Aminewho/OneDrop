<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>OneDrop</title>

<style>

html,
body{

    width:100%;
    height:100%;

    margin:0;

    background:#181818;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Segoe UI;

    color:white;

}

.container{

    text-align:center;

}

.logo{

    font-size:48px;

    font-weight:bold;

    margin-bottom:25px;

}

.loader{

    width:280px;

    height:6px;

    background:#333;

    border-radius:50px;

    overflow:hidden;

}

.bar{

    height:100%;

    width:40%;

    background:#00c853;

    animation:loading 1.2s infinite;

}

@keyframes loading{

0%{

transform:translateX(-100%);

}

100%{

transform:translateX(300%);

}

}

.subtitle{

margin-top:20px;

color:#bdbdbd;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

OneDrop

</div>

<div class="loader">

<div class="bar"></div>

</div>

<div class="subtitle">

Starting application...

</div>

</div>

</body>

</html>
